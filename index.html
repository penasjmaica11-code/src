<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Boxwise</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --transition-fast: 150ms;
        --transition-normal: 300ms;
        --transition-slow: 500ms;
        --ease-out: cubic-bezier(0.0, 0, 0.2, 1);
        --ease-bounce: cubic-bezier(0.68, -0.6, 0.32, 1.6);
        --space-xs: 8px;
        --space-sm: 16px;
        --space-md: 24px;
        --space-lg: 32px;
        --space-xl: 48px;
        --bg: #FFF8E7;
        --card-bg: #FFFFFF;
        --odd-color: #FF6B6B;
        --even-color: #4ECDC4;
        --text-dark: #2D3436;
        --text-light: #636E72;
        --shadow: 0 4px 16px rgba(0,0,0,0.12);
        --shadow-lg: 0 8px 32px rgba(0,0,0,0.18);
      }

      body, html {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        overflow: hidden;
        touch-action: none;
        -ms-touch-action: none;
        font-family: 'Inter', sans-serif;
        background: var(--bg);
        user-select: none;
        -webkit-user-select: none;
      }

      #game-world {
        position: relative;
        width: 720px; height: 1280px;
        overflow: hidden;
        background: var(--bg);
      }
      #game-world.standalone {
        position: absolute;
        left: 50%;
        top: 50%;
        box-sizing: border-box;
        border: 2px solid #182137;
        border-radius: 12px;
        transform-origin: center;
      }

      .title-area {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: 34px 20px 16px;
        margin: 0 28px;
        border-radius: 0 0 30px 30px;
        background: linear-gradient(180deg, rgba(255,250,231,.94), rgba(255,246,215,.82));
        box-shadow: 0 6px 18px rgba(117,78,32,.16);
        border: 2px solid rgba(186,135,60,.24);
        border-top: 0;
      }
      .title-area h1 {
        font-family: 'Fredoka', sans-serif;
        font-size: 48px;
        font-weight: 700;
        color: #563b21;
        margin: 0;
        text-shadow: 0 2px 0 rgba(255,255,255,.9);
      }
      .title-area p {
        font-family: 'Inter', sans-serif;
        font-size: 22px;
        line-height: 1.3;
        color: #765b3c;
        margin: 8px 0 0 0;
      }

      .progress-bar-wrap {
        width: 400px;
        height: 16px;
        background: #E0E0E0;
        border-radius: 8px;
        margin: 24px auto 0;
        overflow: hidden;
      }
      .progress-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #FFD93D, #FF6B6B);
        border-radius: 8px;
        transition: width var(--transition-normal) var(--ease-out);
      }

      .card-zone {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 360px;
        position: relative;
      }

      .number-card {
        width: 200px; height: 240px;
        touch-action: none;
        background-color: var(--card-bg);
        background-position: center;
        background-size: 100% 100%;
        border-radius: 25px;
        box-shadow: var(--shadow-lg);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Fredoka', sans-serif;
        font-size: 120px;
        font-weight: 700;
        color: #49351f;
        text-shadow: 0 2px 0 rgba(255,255,255,.9);
        cursor: grab;
        position: absolute;
        z-index: 10;
        transition: transform var(--transition-fast) var(--ease-out), box-shadow var(--transition-fast);
        border: 4px solid #F0E6D3;
      }
      .number-card.has-art {
        background-color: transparent;
        background-repeat: no-repeat;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        padding-bottom: 5px;
      }
      .number-card.dragging {
        cursor: grabbing;
        transform: scale(1.08) rotate(-2deg);
        filter: drop-shadow(0 12px 14px rgba(71,49,27,.32));
        z-index: 100;
        transition: none;
      }
      .number-card.correct-anim {
        animation: correctPop 500ms var(--ease-bounce);
      }
      .number-card.wrong-anim {
        animation: wrongShake 400ms ease;
      }

      @keyframes correctPop {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.3); opacity: 0.8; }
        100% { transform: scale(0); opacity: 0; }
      }
      @keyframes wrongShake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-16px); }
        40% { transform: translateX(16px); }
        60% { transform: translateX(-10px); }
        80% { transform: translateX(10px); }
      }

      .bins-zone {
        position: relative;
        z-index: 3;
        display: flex;
        justify-content: center;
        gap: 40px;
        padding: 0 32px;
      }

      .bin {
        width: 280px; height: 250px;
        border-radius: 28px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: transform var(--transition-fast) var(--ease-out),
                    box-shadow var(--transition-fast), border-color var(--transition-fast);
        border: 4px solid transparent;
        position: relative;
        background: rgba(255,248,224,.45);
        overflow: visible;
      }
      .bin-odd { box-shadow: 0 8px 22px rgba(204,83,48,.20); }
      .bin-even { box-shadow: 0 8px 22px rgba(44,133,166,.20); }
      .bin-art {
        display: none;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
        pointer-events: none;
        user-select: none;
        z-index: 0;
      }
      .bin.hover, .bin.kb-selected {
        transform: scale(1.045);
        border-color: #FFD45A;
        box-shadow: 0 10px 28px rgba(69,48,23,.28);
      }
      .bin .bin-icon {
        display: none;
        position: absolute;
        z-index: 1;
        top: 18px;
        font-size: 44px;
        line-height: 1;
        filter: drop-shadow(0 2px 1px rgba(255,255,255,.8));
      }
      .bin .bin-label {
        position: absolute;
        z-index: 1;
        top: 57%;
        left: 10px;
        right: 10px;
        padding: 6px 8px;
        box-sizing: border-box;
        border-radius: 14px;
        text-align: center;
        font-family: 'Fredoka', sans-serif;
        font-size: 38px;
        font-weight: 700;
        color: #fff;
        text-shadow: 0 2px 2px rgba(64,39,19,.35);
        background: rgba(195,76,49,.88);
      }
      .bin-odd .bin-label { background: var(--odd-color, rgba(195,76,49,.88)); }
      .bin-even .bin-label { background: var(--even-color, rgba(43,139,163,.90)); }
      .bin .bin-hint {
        position: absolute;
        z-index: 1;
        top: 74%;
        left: 6px;
        right: 6px;
        text-align: center;
        font-family: 'Inter', sans-serif;
        font-size: 17px;
        font-weight: 600;
        color: #765b3c;
        margin-top: 4px;
      }

      .scene-background {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background: linear-gradient(180deg, #f8e5b6, #ead09a);
      }
      .scene-background-img {
        width: 100%; height: 100%;
        display: block;
        object-fit: cover;
      }
      .scene-background::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(255,248,224,.10), rgba(255,245,210,.15));
      }
      .sorter-mascot {
        position: absolute;
        z-index: 2;
        top: 225px;
        right: 12px;
        width: 145px;
        height: 210px;
        object-fit: contain;
        object-position: bottom center;
        pointer-events: none;
        filter: drop-shadow(0 7px 5px rgba(85,56,25,.2));
      }
      .feedback-toast {
        position: absolute;
        top: 440px;
        left: 50%;
        transform: translateX(-50%) translateY(10px);
        padding: 12px 32px;
        border-radius: 16px;
        font-family: 'Fredoka', sans-serif;
        font-size: 28px;
        font-weight: 600;
        color: #fff;
        opacity: 0;
        pointer-events: none;
        z-index: 200;
        transition: opacity var(--transition-normal), transform var(--transition-normal);
        text-align: center;
        white-space: nowrap;
      }
      .feedback-toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .feedback-toast.correct {
        background: #27AE60;
        box-shadow: 0 4px 16px rgba(39,174,96,0.4);
      }
      .feedback-toast.wrong {
        background: #E74C3C;
        box-shadow: 0 4px 16px rgba(231,76,60,0.4);
      }

      .player-hud {
        position:relative; z-index:6; margin:10px 28px 4px; padding:12px 16px 14px;
        border:3px solid #9b7540; border-radius:24px; background:rgba(255,249,228,.94);
        box-shadow:0 5px 14px #55391c33; text-align:center;
      }
      .player-summary { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:12px 22px; color:#49351f; font:700 22px 'Fredoka',sans-serif; }
      .player-hearts { display:flex; gap:5px; align-items:center; }
      .player-heart { color:#c8bdb0; font-size:28px; line-height:1; text-shadow:0 1px #fff; }
      .player-heart.full { color:#e74c3c; }
      .heart-lockout { min-height:0; margin-top:3px; color:#b32f25; font:700 18px 'Inter',sans-serif; }
      .heart-lockout:empty { display:none; }
      .inventory-row { display:flex; justify-content:center; gap:12px; margin-top:10px; }
      .powerup-button { position:relative; width:145px; min-height:98px; border:3px solid #7b562e; border-radius:20px; background:linear-gradient(145deg,#fff4ca,#f4d58d); color:#49351f; font:700 18px/1.1 'Fredoka',sans-serif; cursor:pointer; box-shadow:0 4px 0 #9a713e; }
      .powerup-button:disabled { opacity:.58; cursor:not-allowed; }
      .powerup-button:active:not(:disabled) { transform:translateY(2px); }
      .powerup-icon { display:block; font-size:30px; margin-bottom:3px; }
      .inventory-badge { position:absolute; top:-10px; right:-8px; min-width:34px; height:34px; padding:0 5px; box-sizing:border-box; display:grid; place-items:center; border:3px solid #fff; border-radius:50%; background:#df2f35; color:#fff; font:700 19px 'Inter',sans-serif; box-shadow:0 2px 5px #321b1b66; }
      .bin.hint-pulse { animation: hintPulse .75s ease-in-out 3; z-index:5; }
      @keyframes hintPulse { 0%,100% { transform:scale(1); box-shadow:0 8px 18px #57391f33; } 50% { transform:scale(1.10); box-shadow:0 0 0 10px #ffd34d99,0 0 32px 12px #ffe47b; } }
      .shop-overlay { position:absolute; inset:0; z-index:500; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; background:rgba(31,35,45,.62); }
      .shop-panel { width:min(620px,100%); max-height:92%; overflow:auto; padding:26px 24px; box-sizing:border-box; border:5px solid #80562e; border-radius:30px; background:#fff8e7; box-shadow:0 18px 46px #0006; text-align:center; }
      .shop-panel h2 { margin:0 0 8px; color:#49351f; font:700 38px 'Fredoka',sans-serif; }
      .shop-coins { margin:0 0 16px; color:#73552f; font:700 22px 'Inter',sans-serif; }
      .shop-items { display:flex; flex-direction:column; gap:12px; }
      .shop-item { position:relative; display:grid; grid-template-columns:62px 1fr auto; align-items:center; gap:12px; padding:14px; border:3px solid #d0aa67; border-radius:20px; background:#fffdf6; text-align:left; }
      .shop-item-icon { font-size:42px; text-align:center; }
      .shop-item h3 { margin:0 0 4px; color:#49351f; font:700 23px 'Fredoka',sans-serif; }
      .shop-item p { margin:0; color:#705e49; font:16px/1.25 'Inter',sans-serif; }
      .shop-buy { min-width:112px; min-height:60px; border:3px solid #473b24; border-radius:30px; background:#ffc63d; color:#49351f; font:700 20px 'Fredoka',sans-serif; cursor:pointer; }
      .shop-buy:disabled { opacity:.5; cursor:not-allowed; }
      .shop-owned { position:absolute; right:7px; top:7px; min-width:28px; height:28px; padding:0 4px; display:grid; place-items:center; border-radius:50%; background:#df2f35; color:white; font:700 16px 'Inter',sans-serif; }
      .shop-message { min-height:24px; margin:12px 0 0; color:#b32f25; font:600 17px 'Inter',sans-serif; }
      .shop-close { min-height:64px; margin-top:14px; padding:8px 32px; border:3px solid #49351f; border-radius:32px; background:#4384e1; color:#fff; font:700 22px 'Fredoka',sans-serif; cursor:pointer; }
      .shop-open-button { min-height:62px; padding:10px 28px; border:3px solid #523b24; border-radius:32px; background:#ffc63d; color:#49351f; font:700 22px 'Fredoka',sans-serif; cursor:pointer; box-shadow:0 4px 0 #9a681f; }
      .level-map-heading .player-hud-compact { margin:5px auto 0; padding:5px 8px; }
      .level-map-heading .player-summary { gap:4px 12px; font-size:18px; }
      .level-map-heading .player-heart { font-size:21px; }
      .level-map-heading .shop-open-button { min-height:42px; padding:4px 18px; font-size:18px; }
      .briefing-panel .player-hud-compact { margin:8px auto 0; padding:8px; }
      .briefing-panel .shop-open-button { min-height:50px; }
      .map-summary { margin:0 0 5px; padding:8px 12px; border:2px solid #957044; border-radius:18px; background:#fff8dfdd; }
      .map-lockout { margin:0 0 6px; text-align:center; }
      .map-actions { display:flex; justify-content:center; align-items:center; gap:14px; flex-wrap:wrap; }
      .briefing-start:disabled { opacity:.48; cursor:not-allowed; filter:grayscale(.35); }
      .counter {
        text-align: center;
        margin-top: 32px;
        font-family: 'Fredoka', sans-serif;
        font-size: 24px;
        color: var(--text-light);
      }

      .done-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.45);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 300;
      }
      .done-panel {
        background: #fff;
        border-radius: 32px;
        padding: 48px 40px;
        text-align: center;
        box-shadow: var(--shadow-lg);
        max-width: 520px;
      }
      .done-panel h2 {
        font-family: 'Fredoka', sans-serif;
        font-size: 44px;
        color: var(--text-dark);
        margin: 0 0 16px;
      }
      .done-panel p {
        font-size: 24px;
        color: var(--text-light);
        margin: 0 0 32px;
      }
      .done-panel button {
        font-family: 'Fredoka', sans-serif;
        font-size: 28px;
        padding: 16px 48px;
        border: none;
        border-radius: 16px;
        background: linear-gradient(145deg, #FFD93D, #F0932B);
        color: #fff;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(240,147,43,0.4);
        transition: transform var(--transition-fast);
      }
      .done-panel button:hover,
      .done-panel button:active {
        transform: scale(1.05);
      }

      .kb-hint {
        text-align: center;
        margin-top: 24px;
        font-size: 18px;
        color: var(--text-light);
        opacity: 0.7;
      }

      /* Boxwise main entry screen */
      .menu-screen {
        position: absolute; inset: 0; overflow: hidden;
        display: flex; flex-direction: column; align-items: center;
        background:
          radial-gradient(ellipse at 50% 15%, rgba(255,255,255,.78) 0 18%, transparent 45%),
          linear-gradient(180deg, #fff1c9 0%, #fff7dc 58%, #f5d99c 100%);
        color: #172b73;
      }
      .menu-screen::before {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(90deg, rgba(255,255,255,.18), transparent 35%, rgba(173,101,35,.08));
        pointer-events: none;
      }
      .menu-window {
        position: absolute; right: -35px; top: 80px; width: 190px; height: 360px;
        border: 14px solid #b66b35; border-radius: 12px 0 0 12px;
        background: repeating-linear-gradient(0deg, #d9f4f5 0 80px, #fff7db 82px 95px);
        box-shadow: inset 0 0 0 8px rgba(255,255,255,.4), 0 12px 28px rgba(100,65,28,.16);
        opacity: .68; transform: perspective(500px) rotateY(-8deg);
      }
      .menu-window::after { content:""; position:absolute; left:50%; top:0; height:100%; border-left:10px solid #b66b35; }
      .menu-shelf { position:absolute; top:44%; left:-5px; right:0; height:18px; background:#b66b35; box-shadow:0 6px 8px #80532955; }
      .menu-logo { position:relative; z-index:2; margin-top:170px; text-align:center; transform:rotate(-2deg); }
      .menu-logo h1 { margin:0; font-family:'Fredoka',sans-serif; font-size:112px; line-height:.9; letter-spacing:-5px; font-weight:700; color:#ffc21a; text-shadow:5px 7px 0 #b87917, 8px 10px 0 rgba(75,54,35,.2); }
      .menu-logo h1 span { color:#4385df; text-shadow:5px 7px 0 #2456a5, 8px 10px 0 rgba(75,54,35,.2); }
      .menu-ribbon { position:relative; display:inline-block; margin-top:18px; padding:13px 34px 15px; background:#182b8b; color:#fff; font:700 20px 'Inter',sans-serif; letter-spacing:1px; transform:rotate(-2deg); box-shadow:0 6px 0 #101b5b; }
      .menu-ribbon::before,.menu-ribbon::after { content:""; position:absolute; bottom:-15px; border-top:20px solid #111e67; }
      .menu-ribbon::before { left:-24px; border-left:24px solid transparent; }
      .menu-ribbon::after { right:-24px; border-right:24px solid transparent; }
      .menu-actions { position:relative; z-index:7; display:flex; flex-direction:column; gap:22px; width:600px; margin-top:34px; pointer-events:auto; }
      .menu-actions .menu-button { position:relative; z-index:1; width:100%; pointer-events:auto; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
      .menu-actions .player-summary { padding:9px 14px; border:3px solid #886339; border-radius:24px; background:#fff7dfed; box-shadow:0 4px 10px #50361533; }
      .menu-actions .heart-lockout { text-align:center; font-size:20px; }
      .menu-screen > .player-hud-compact { position:absolute; z-index:8; top:12px; right:14px; margin:0; padding:6px 10px; border-width:2px; border-radius:20px; background:rgba(255,249,228,.96); box-shadow:0 4px 12px #50361544; }
      .menu-screen > .player-hud-compact .player-summary { gap:8px 12px; font-size:19px; }
      .menu-screen > .player-hud-compact .player-heart { font-size:22px; }
      .menu-screen > .player-hud-compact .heart-lockout { font-size:14px; }
      .menu-screen > .player-hud-compact .shop-open-button { min-height:42px; padding:5px 16px; font-size:18px; }
      .menu-button { min-height:112px; border:5px solid #202631; border-radius:50px; color:#fff; font:600 48px 'Inter',sans-serif; cursor:pointer; box-shadow:0 7px 0 rgba(0,0,0,.13), inset 0 2px 0 rgba(255,255,255,.35); transition:transform 140ms ease, filter 140ms ease; }
      .menu-button:active { transform:translateY(4px) scale(.99); filter:brightness(.96); }
      .menu-start { background:#4384e1; }
      .menu-settings { background:#ffbd17; }
      .menu-quit { background:#d93719; }
      .menu-decoration { position:absolute; z-index:1; border-radius:22px; box-shadow:0 12px 16px rgba(83,53,22,.18); }
      .menu-block-green { width:185px; height:135px; left:12px; bottom:480px; background:linear-gradient(135deg,#a9e480,#76c75d); transform:rotate(-3deg); }
      .menu-block-green::after { content:'✂️  ●'; position:absolute; left:28px; bottom:18px; color:#fff; font-size:28px; }
      .menu-block-blue { width:150px; height:160px; right:-30px; bottom:360px; background:linear-gradient(135deg,#66d7ee,#269ac8); transform:rotate(8deg); }
      .menu-block-blue::after { content:'△'; display:grid; place-items:center; width:85px; height:85px; margin:35px auto; color:#fff; font:700 58px 'Fredoka',sans-serif; background:#f8c54e; border-radius:18px; }
      .menu-block-yellow { width:205px; height:145px; left:310px; bottom:280px; background:linear-gradient(135deg,#ffe36c,#e9ad21); transform:rotate(2deg); }
      .menu-block-yellow::after { content:'📐'; position:absolute; left:76px; top:35px; font-size:54px; }
      .menu-books { position:absolute; left:-40px; bottom:95px; width:250px; height:125px; z-index:2; transform:rotate(-4deg); }
      .menu-books i { display:block; height: thirty; height:34px; border:3px solid #b55835; border-radius:8px; margin:3px 0; box-shadow:0 5px 5px #70462655; }
      .menu-books i:nth-child(1){width:220px;background:#ffb629}.menu-books i:nth-child(2){width:195px;background:#f8f1d5}.menu-books i:nth-child(3){width:240px;background:#e65c3e}
      .menu-kid { position:absolute; z-index:3; left:18px; bottom:190px; width:155px; height:270px; object-fit:contain; object-position:bottom center; filter:drop-shadow(4px 8px 2px #543b2a44); }
      .menu-tagline { position:absolute; z-index:4; left:270px; bottom:145px; width:360px; padding:22px 24px; color:#ffd32e; text-align:center; font:700 27px 'Fredoka',sans-serif; background:#20366e; clip-path:polygon(5% 14%,96% 3%,91% 92%,3% 100%); transform:rotate(-5deg); text-shadow:1px 2px #18234a; }
      .menu-tagline small { display:block; color:white; font:600 17px 'Inter',sans-serif; margin-top:4px; }
      .menu-footer { position:absolute; z-index:6; bottom:0; left:0; right:0; height:72px; display:grid; place-items:center; background:#202587; color:#fff; font:700 18px 'Inter',sans-serif; }
      .menu-dialog { position:absolute; z-index:620; inset:0; display:flex; align-items:center; justify-content:center; padding:32px; background:rgba(20,30,65,.55); }
      .menu-dialog-card { width:540px; padding:38px; text-align:center; border:5px solid #25336a; border-radius:32px; background:#fff8e7; box-shadow:0 18px 45px #0005; }
      .menu-dialog-card h2 { margin:0 0 18px; font:700 42px 'Fredoka',sans-serif; color:#22336d; }
      .menu-dialog-card p { margin:0 0 28px; font:24px/1.4 'Inter',sans-serif; color:#48515c; }
      .menu-dialog-card button { min-height:88px; padding:12px 42px; border:4px solid #202631; border-radius:44px; background:#4384e1; color:#fff; font:600 30px 'Inter',sans-serif; }

    <script>
      /*
  BOXWISE – Math Corner Level 1: Odd vs Even
  Drag digits 0-9 into Odd or Even bins.
  0 is even. Shuffled order. Gentle feedback on wrong drops.
*/

  const standaloneMode = !window.gameConfig;
  if (standaloneMode) {
    const standaloneWorlds = JSON.parse(
      document.getElementById('boxwise-standalone-worlds').textContent
    );
    window.gameConfig = {
      levelTitle: 'Odd vs Even',

    if (typeof window.lib === 'undefined') {
      const standaloneAssets = {

        boxwise_sorting_box_left: 'box1.png',
        boxwise_sorting_box_right: 'box2.png',
        boxwise_world_map_parchment: 'environment.png',
        boxwise_gameplay_classroom_bg: 'mathcorner.png',
        boxwise_gameplay_mascot: 'main.png',
        boxwise_gameplay_banner: 'banner.png',
        boxwise_inventory_button_art: 'inventory.jpg',
        boxwise_store_button_art: 'storebutton.jpg',
        boxwise_gift_button_art: 'gift.jpg',
        'image.png': '3.jpg',
        boxwise_math_corner_level_map_background: 'mathlevelmap.png',
        boxwise_nutrition_zone_level_map_background: 'nutritionlevelmap.png',
        boxwise_animals_nature_level_map_background: 'naturelevelmap.png',
        boxwise_world_map_watercolor_background: 'environment.png',
        boxwise_nature_gameplay_background: 'naturemain.png',
        'Healthy Choices Farm Market.png': 'nutritionmain.png',
        boxwise_background_music:
          'https://d2oir5eh8rty2e.cloudfront.net/assets/sounds/music/boxwise_background_music_641fb843-6321-49c4-bd8e-eedf7a73a34c.mp3',
        level_complete_sting:
          'https://d2oir5eh8rty2e.cloudfront.net/assets/sounds/music/level_complete_sting_16688ba6-75df-48f9-9c3e-2e17394709d3.mp3',
        gentle_miss_cue:
          'https://d2oir5eh8rty2e.cloudfront.net/assets/sounds/effect/gentle_miss_cue_b2f86f47-2792-42e3-8900-a0a9589e8fc1.mp3',
        correct_sort_chime:
          'https://d2oir5eh8rty2e.cloudfront.net/assets/sounds/effect/correct_sort_chime_669039fc-ad5e-4c32-8d48-5305cea0e94d.mp3',
      };
      window.lib = {
        getAsset: (id) => {
          const filename = standaloneAssets[id];
          return filename ? { url: new URL(filename, document.baseURI).href } : null;
        },
      };
    }
  }

  async function run(mode, selectedWorldIndex = null, selectedLevelIndex = null) {
        if (window.__boxwiseHudInterval) clearInterval(window.__boxwiseHudInterval);
        if (window.__boxwiseAutoAdvanceTimeout) {
          clearTimeout(window.__boxwiseAutoAdvanceTimeout);
          window.__boxwiseAutoAdvanceTimeout = null;
        }
        if (window.__boxwiseAutoStartTimer) {
          clearTimeout(window.__boxwiseAutoStartTimer);
          window.__boxwiseAutoStartTimer = null;
        }
        if (window.__boxwiseTimerIntervals)
          window.__boxwiseTimerIntervals.forEach((timerId) => clearInterval(timerId));
        if (window.__boxwiseRuntimeIntervals)
          window.__boxwiseRuntimeIntervals.forEach((timerId) => {
            if (typeof timerId === 'number' && window.cancelAnimationFrame)
              window.cancelAnimationFrame(timerId);
            else clearInterval(timerId);
          });
        window.__boxwiseRuntimeIntervals = [];
        window.__boxwiseTimerIntervals = [];
        const gw = document.getElementById('game-world');
        const cfg = window.gameConfig;
        const worlds = Array.isArray(cfg.worlds) ? cfg.worlds : [];
        if (
          (mode === 'edit' || mode === 'preview') &&
          selectedWorldIndex === null &&
          worlds.length
        ) {
          const remembered = window.__boxwiseEditorSelection;
          selectedWorldIndex = remembered ? remembered.worldIndex : 0;
          selectedLevelIndex = remembered ? remembered.levelIndex : 0;
        }
        if (mode === 'edit')
          window.__boxwiseEditorSelection = {
            worldIndex: selectedWorldIndex,
            levelIndex: selectedLevelIndex,
          };
        const playChallenge =
          selectedWorldIndex !== null &&
          worlds[selectedWorldIndex] &&
          worlds[selectedWorldIndex].levels
            ? worlds[selectedWorldIndex].levels[selectedLevelIndex]
            : null;

        // Player-specific data is saved in the player-state API and mirrored on this device.
        const BOXWISE_STATE_VERSION = 1;
        const DEVICE_SAVE_KEY = 'boxwise-player-save-v1';
        const MAX_PLAYER_HEARTS = 5;
        const HEART_REFILL_DURATION_MS = 5 * 60 * 1000;
        const INVENTORY_KEYS = ['hintLens', 'timeBubble', 'shuffleBell'];
        const progressDefaults = () => Object.fromEntries(worlds.map((world) => [world.id, 1]));
        const sessionProgress =
          window.__boxwiseSessionProgress || (window.__boxwiseSessionProgress = progressDefaults());
        let unlockedLevels = progressDefaults();
        let loadedUserState = {};
        let deviceSave = null;
        let localProgressResetAt = 0;
        function reportDeviceSaveError(action, error) {
          const message = `Boxwise could not ${action} this device's saved progress: ${error.message}`;
          if (typeof lib !== 'undefined' && typeof lib.log === 'function') lib.log(message);
          else console.error(message);
        }
        function readDeviceSave() {
          try {
            const saved = window.localStorage.getItem(DEVICE_SAVE_KEY);
            if (!saved) return null;
            const parsed = JSON.parse(saved);
            return parsed && typeof parsed === 'object' && !Array.isArray(parsed)
              ? parsed
              : null;
          } catch (error) {
            reportDeviceSaveError('read', error);
            return null;
          }
        }
        function writeDeviceSave() {
          if (mode !== 'play') return false;
          try {
            const saved = {
              version: 1,
              progressResetAt: localProgressResetAt,
              unlockedLevels: { ...unlockedLevels },
              boxwiseState: sanitizeBoxwiseState(boxwiseState),
              boxwiseSettings: sanitizeBoxwiseSettings(boxwiseSettings),
            };
            window.localStorage.setItem(DEVICE_SAVE_KEY, JSON.stringify(saved));
            window.__boxwiseStandalonePlayerState = saved.boxwiseState;
            return true;
          } catch (error) {
            reportDeviceSaveError('write', error);
            return false;
          }
        }
        worlds.forEach((world) => {
          unlockedLevels[world.id] = Math.max(
            1,
            Math.min((world.levels || []).length || 14, Number(sessionProgress[world.id]) || 1)
          );
        });
        const persistenceState = {
          available:
            mode === 'play' &&
            typeof lib !== 'undefined' &&
            typeof lib.getUserGameState === 'function' &&
            typeof lib.saveUserGameState === 'function',
        };
        const freshLevelLists = () => Object.fromEntries(worlds.map((world) => [world.id, []]));
        const defaultBoxwiseState = () => ({
          version: BOXWISE_STATE_VERSION,
          coins: 0,
          stars: 0,
          hearts: MAX_PLAYER_HEARTS,
          heartRefillAt: 0,
          inventory: { hintLens: 0, timeBubble: 0, shuffleBell: 0 },
          completedLevels: freshLevelLists(),
          firstClears: freshLevelLists(),
        });
        const defaultBoxwiseSettings = () => ({ calmPace: false, soundEnabled: true });
        if (!window.__boxwiseSettingsSession || typeof window.__boxwiseSettingsSession !== 'object')
          window.__boxwiseSettingsSession = defaultBoxwiseSettings();
        function sanitizeBoxwiseSettings(source) {
          const settings =
            source && typeof source === 'object' && !Array.isArray(source) ? source : {};
          return {
            calmPace: typeof settings.calmPace === 'boolean' ? settings.calmPace : false,
            soundEnabled: typeof settings.soundEnabled === 'boolean' ? settings.soundEnabled : true,
          };
        }
        let boxwiseSettings = sanitizeBoxwiseSettings(window.__boxwiseSettingsSession);
        let boxwiseSettingsRevision = 0;
        function getBoxwiseSettings() {
          return { ...boxwiseSettings };
        }
        function safeWholeNumber(value, maximum = Number.MAX_SAFE_INTEGER) {
          const number = Number(value);
          return Number.isFinite(number) ? Math.max(0, Math.min(maximum, Math.floor(number))) : 0;
        }
        function sanitizeLevelLists(source) {
          const result = freshLevelLists();
          worlds.forEach((world) => {
            const maximum = (world.levels || []).length;
            const values = source && Array.isArray(source[world.id]) ? source[world.id] : [];
            result[world.id] = [
              ...new Set(
                values
                  .map((value) => safeWholeNumber(value, maximum))
                  .filter((levelNumber) => levelNumber >= 1 && levelNumber <= maximum)
              ),
            ].sort((a, b) => a - b);
          });
          return result;
        }
        function sanitizeBoxwiseState(source) {
          const state =
            source && typeof source === 'object' && !Array.isArray(source) ? source : {};
          let hearts = safeWholeNumber(state.hearts, MAX_PLAYER_HEARTS);
          let heartRefillAt = safeWholeNumber(state.heartRefillAt);
          const now = Date.now();
          if (heartRefillAt > now + HEART_REFILL_DURATION_MS)
            heartRefillAt = now + HEART_REFILL_DURATION_MS;
          // Invalid zero-heart saves should never lock a player out indefinitely.
          if (hearts === 0 && heartRefillAt <= now) {
            hearts = MAX_PLAYER_HEARTS;
            heartRefillAt = 0;
          } else if (hearts > 0) {
            heartRefillAt = 0;
          }
          const inventorySource =
            state.inventory &&
            typeof state.inventory === 'object' &&
            !Array.isArray(state.inventory)
              ? state.inventory
              : {};
          const inventory = {};
          INVENTORY_KEYS.forEach((key) => {
            inventory[key] = safeWholeNumber(inventorySource[key], 99999);
          });
          const completedLevels = sanitizeLevelLists(state.completedLevels);
          const firstClears = sanitizeLevelLists(state.firstClears);
          worlds.forEach((world) => {
            // A recorded first clear is also evidence that the level was completed.
            completedLevels[world.id] = [
              ...new Set([...completedLevels[world.id], ...firstClears[world.id]]),
            ].sort((a, b) => a - b);
          });
          return {
            version: BOXWISE_STATE_VERSION,
            coins: safeWholeNumber(state.coins),
            stars: safeWholeNumber(state.stars),
            hearts,
            heartRefillAt,
            inventory,
            completedLevels,
            firstClears,
          };
        }
        if (mode === 'play') {
          deviceSave = readDeviceSave();
          localProgressResetAt = safeWholeNumber(deviceSave && deviceSave.progressResetAt);
          worlds.forEach((world) => {
            const count = Number(deviceSave && deviceSave.unlockedLevels && deviceSave.unlockedLevels[world.id]);
            if (Number.isFinite(count)) {
              unlockedLevels[world.id] = Math.max(
                unlockedLevels[world.id],
                Math.max(1, Math.min((world.levels || []).length || 14, Math.floor(count)))
              );
              sessionProgress[world.id] = unlockedLevels[world.id];
            }
          });
          if (deviceSave && deviceSave.boxwiseSettings)
            window.__boxwiseSettingsSession = sanitizeBoxwiseSettings(deviceSave.boxwiseSettings);
        }
        let boxwiseState = sanitizeBoxwiseState(
          deviceSave && deviceSave.boxwiseState
            ? deviceSave.boxwiseState
            : standaloneMode
              ? window.__boxwiseStandalonePlayerState
              : null
        );
        let persistenceWriteQueue = Promise.resolve();
        function refreshPlayerHearts() {
          if (
            boxwiseState.hearts === 0 &&
            boxwiseState.heartRefillAt > 0 &&
            Date.now() >= boxwiseState.heartRefillAt
          ) {
            boxwiseState.hearts = MAX_PLAYER_HEARTS;
            boxwiseState.heartRefillAt = 0;
            return true;
          }
          return false;
        }
        function getBoxwiseState() {
          if (refreshPlayerHearts()) void saveProgress();
          return JSON.parse(JSON.stringify(boxwiseState));
        }
        async function saveBoxwiseState(updates = {}) {
          const patch =
            updates && typeof updates === 'object' && !Array.isArray(updates) ? updates : {};
          const inventoryPatch =
            patch.inventory &&
            typeof patch.inventory === 'object' &&
            !Array.isArray(patch.inventory)
              ? patch.inventory
              : {};
          const candidate = {
            ...boxwiseState,
            ...patch,
            inventory: { ...boxwiseState.inventory, ...inventoryPatch },
            completedLevels: patch.completedLevels
              ? Object.fromEntries(
                  worlds.map((world) => [
                    world.id,
                    [
                      ...new Set([
                        ...(boxwiseState.completedLevels[world.id] || []),
                        ...(Array.isArray(patch.completedLevels[world.id])
                          ? patch.completedLevels[world.id]
                          : []),
                      ]),
                    ],
                  ])
                )
              : boxwiseState.completedLevels,
            firstClears: patch.firstClears
              ? Object.fromEntries(
                  worlds.map((world) => [
                    world.id,
                    [
                      ...new Set([
                        ...(boxwiseState.firstClears[world.id] || []),
                        ...(Array.isArray(patch.firstClears[world.id])
                          ? patch.firstClears[world.id]
                          : []),
                      ]),
                    ],
                  ])
                )
              : boxwiseState.firstClears,
            version: BOXWISE_STATE_VERSION,
          };
          if (Number(candidate.hearts) <= 0 && !Number(candidate.heartRefillAt)) {
            candidate.heartRefillAt = Date.now() + HEART_REFILL_DURATION_MS;
          }
          boxwiseState = sanitizeBoxwiseState(candidate);
          refreshPlayerHearts();
          await saveProgress();
          return getBoxwiseState();
        }
        async function losePlayerHeart() {
          refreshPlayerHearts();
          if (boxwiseState.hearts <= 0) return getBoxwiseState();
          boxwiseState.hearts = Math.max(0, boxwiseState.hearts - 1);
          if (boxwiseState.hearts === 0)
            boxwiseState.heartRefillAt = Date.now() + HEART_REFILL_DURATION_MS;
          await saveProgress();
          return getBoxwiseState();
        }
        function recordLevelCompletion(worldId, levelNumber) {
          if (!worlds.some((world) => world.id === worldId)) return false;
          const level = safeWholeNumber(
            levelNumber,
            (worlds.find((world) => world.id === worldId).levels || []).length
          );
          if (level < 1) return false;
          const completed = new Set(boxwiseState.completedLevels[worldId] || []);
          const isFirstClear = !completed.has(level);
          completed.add(level);
          boxwiseState.completedLevels[worldId] = [...completed].sort((a, b) => a - b);
          if (isFirstClear) {
            const first = new Set(boxwiseState.firstClears[worldId] || []);
            first.add(level);
            boxwiseState.firstClears[worldId] = [...first].sort((a, b) => a - b);
          }
          return isFirstClear;
        }
        if (mode === 'play' && persistenceState.available) {
          try {
            const saved = await lib.getUserGameState();
            if (
              saved &&
              saved.state &&
              typeof saved.state === 'object' &&
              !Array.isArray(saved.state)
            ) {
              loadedUserState = { ...saved.state };
            }
            boxwiseSettings = sanitizeBoxwiseSettings(loadedUserState.boxwiseSettings);
            window.__boxwiseSettingsSession = sanitizeBoxwiseSettings(boxwiseSettings);
            const storedProgress = loadedUserState.boxwiseProgress;
            const remoteProgressResetAt = safeWholeNumber(
              storedProgress && storedProgress.resetAt
            );
            const localResetIsNewer = localProgressResetAt > remoteProgressResetAt;
            if (!localResetIsNewer) localProgressResetAt = remoteProgressResetAt;
            if (
              storedProgress &&
              (storedProgress.version === 1 || storedProgress.version === 2) &&
              storedProgress.unlockedLevels &&
              typeof storedProgress.unlockedLevels === 'object' &&
              !localResetIsNewer
            ) {
              worlds.forEach((world) => {
                const count = Number(storedProgress.unlockedLevels[world.id]);
                unlockedLevels[world.id] = Number.isFinite(count)
                  ? Math.max(
                      unlockedLevels[world.id],
                      Math.max(1, Math.min((world.levels || []).length || 14, Math.floor(count)))
                    )
                  : unlockedLevels[world.id];
                sessionProgress[world.id] = unlockedLevels[world.id];
              });
            }
            const remoteBoxwiseState = sanitizeBoxwiseState(loadedUserState.boxwiseState);
            if (deviceSave && deviceSave.boxwiseState) {
              const localBoxwiseState = sanitizeBoxwiseState(deviceSave.boxwiseState);
              const combineLists = (localLists, remoteLists) =>
                Object.fromEntries(
                  worlds.map((world) => [
                    world.id,
                    localResetIsNewer
                      ? localLists[world.id]
                      : [
                          ...new Set([
                            ...localLists[world.id],
                            ...remoteLists[world.id],
                          ]),
                        ].sort((a, b) => a - b),
                  ])
                );
              boxwiseState = sanitizeBoxwiseState({
                ...localBoxwiseState,
                coins: Math.max(localBoxwiseState.coins, remoteBoxwiseState.coins),
                stars: Math.max(localBoxwiseState.stars, remoteBoxwiseState.stars),
                completedLevels: combineLists(
                  localBoxwiseState.completedLevels,
                  remoteBoxwiseState.completedLevels
                ),
                firstClears: combineLists(
                  localBoxwiseState.firstClears,
                  remoteBoxwiseState.firstClears
                ),
              });
            } else {
              boxwiseState = remoteBoxwiseState;
            }
            if (deviceSave && deviceSave.boxwiseSettings) {
              boxwiseSettings = sanitizeBoxwiseSettings(deviceSave.boxwiseSettings);
              window.__boxwiseSettingsSession = sanitizeBoxwiseSettings(boxwiseSettings);
            }
          } catch (error) {
            if (lib.log)
              lib.log(
                'Boxwise player state could not be loaded; continuing with safe defaults: ' +
                  error.message
              );
          }
        }
        if (mode === 'play') writeDeviceSave();
        async function saveProgress() {
          if (!persistenceState.available) {
            window.__boxwiseStandalonePlayerState = sanitizeBoxwiseState(boxwiseState);
            worlds.forEach((world) => {
              sessionProgress[world.id] = unlockedLevels[world.id] || 1;
            });
            return writeDeviceSave();
          }
          worlds.forEach((world) => {
            sessionProgress[world.id] = unlockedLevels[world.id] || 1;
          });
          writeDeviceSave();
          const write = persistenceWriteQueue
            .then(async () => {
              let latestUserState = { ...loadedUserState };
              try {
                const latest = await lib.getUserGameState();
                if (
                  latest &&
                  latest.state &&
                  typeof latest.state === 'object' &&
                  !Array.isArray(latest.state)
                ) {
                  latestUserState = { ...latestUserState, ...latest.state };
                }
              } catch (error) {
                if (lib.log)

              resetButton.textContent = 'TAP AGAIN TO CONFIRM RESET';
              const note = panel.querySelector('.gameplay-reset-note');

              resetButton.addEventListener('click', async () => {
                resetButton.disabled = true;
                resetButton.textContent = 'RESETTING…';

                if (saved || !persistenceState.available) {
                  resetButton.disabled = false;
                  resetButton.dataset.confirming = 'false';
                  resetButton.textContent = 'LEVEL HISTORY RESET';
                  note.textContent = 'All three worlds are back at Level 1. Your coins, stars, hearts, and power-ups are safe.';

                }
                resetButton.disabled = false;
                resetButton.dataset.confirming = 'false';
                resetButton.textContent = 'TRY RESET AGAIN';
                note.textContent = 'Progress was reset for this session, but could not be saved. Please try again.';
              }, { once: true });
            });
          });
          menu.querySelector('.menu-quit').addEventListener('click', () => {

        }
        window.__boxwiseMenuOpened = false;

        // --- Show game parameters for edit mode ---
        if (mode === 'edit' && selectedWorldIndex === null)

            name: 'Boxwise Creator Controls',

              'Level Title': { key: 'levelTitle', type: 'string' },
              'Briefing Text': { key: 'briefingText', type: 'string' },

              'Even Box Label': { key: 'evenLabel', type: 'string' },
              'Card BG Color': { key: 'cardBg', type: 'color' },
              'Odd Box Color': { key: 'oddColor', type: 'color' },
              'Even Box Color': { key: 'evenColor', type: 'color' },
              'Correct Message': { key: 'correctMsg', type: 'string' },
              'Wrong Message': { key: 'wrongMsg', type: 'string' },
            },
          });

        // --- Runtime state ---
        const isLiveMode = mode === 'play' || mode === 'preview';
        const isPreviewMode = mode === 'preview';
        const pendingBriefing = window.__boxwisePendingBriefing;
        const showIntroBriefing =
          mode === 'play' &&
          !!playChallenge &&
          !!pendingBriefing &&
          pendingBriefing.worldIndex === selectedWorldIndex &&
          pendingBriefing.levelIndex === selectedLevelIndex;
        if (showIntroBriefing) window.__boxwisePendingBriefing = null;
        const levelTitle = playChallenge ? playChallenge.title : cfg.levelTitle;
        const briefingText = playChallenge ? playChallenge.briefing : cfg.briefingText;
        const mechanic = playChallenge ? String(playChallenge.mechanic || 'sorting') : 'sorting';
        const baseLevelTimer = playChallenge
          ? Math.max(0, Math.min(180, Number(playChallenge.timer) || 0))
          : 0;
        const baseMovementSpeed = playChallenge
          ? Math.max(0.5, Math.min(2.5, Number(playChallenge.movementSpeed) || 1))
          : 1;
        const levelTimer =
          baseLevelTimer > 0 && boxwiseSettings.calmPace
            ? Math.min(240, Math.ceil(baseLevelTimer * 1.5))
            : baseLevelTimer;
        const movementSpeed = boxwiseSettings.calmPace
          ? Math.max(0.3, baseMovementSpeed * 0.68)
          : baseMovementSpeed;
        const levelCards = playChallenge
          ? playChallenge.cards.map((item) => ({
              prompt: String(item[0]),
              answer: String(item[1]),
              emoji: String(item[2] || '⭐'),
            }))
          : cfg.digits.map((digit) => ({
              prompt: String(digit),
              answer: Number(digit) % 2 === 0 ? 'Even' : 'Odd',
              emoji: '🔢',
            }));
        let binLabels = playChallenge
          ? playChallenge.bins.map(String)
          : [cfg.oddLabel, cfg.evenLabel];
        let cards = mechanic === 'paired-item' ? [...levelCards] : shuffle([...levelCards]);
        let currentIndex = 0;
        const MAX_LEVEL_MOVES = 15;
        let movesUsed = 0;
        let answerCheckPending = false;
        let levelRewardRecorded = false;
        let lastClearReward = { coins: 0, stars: 0, hintKeys: 0 };
        let feedbackTimer = null;
        let isDone = false;
        let isPaused = false;
        let dragState = null;
        let kbSelected = -1;
        let isTouch = false;

        // --- Build DOM ---
        gw.innerHTML = '';

        const sceneBackground = el('div', 'scene-background');
        const sceneImage = el('img', 'scene-background-img');
        sceneImage.alt = '';
        sceneImage.draggable = false;
        const backgroundId =
          playChallenge && worlds[selectedWorldIndex]
            ? worlds[selectedWorldIndex].background
            : 'boxwise_math_gameplay_background';
        const gameplayBackground =
          mode === 'play' &&
          playChallenge &&
          worlds[selectedWorldIndex] &&
          worlds[selectedWorldIndex].id === 'math' &&
          artUrl('boxwise_math_gameplay_background')
            ? 'boxwise_math_gameplay_background'
            : mode === 'play' &&
                playChallenge &&
                worlds[selectedWorldIndex] &&
                worlds[selectedWorldIndex].id === 'nutrition' &&
                artUrl('Healthy Choices Farm Market.png')

              : mode === 'play' &&
                  playChallenge &&
                  worlds[selectedWorldIndex] &&
                  worlds[selectedWorldIndex].id === 'nature' &&

                : backgroundId;
        if (artUrl(gameplayBackground)) sceneImage.src = artUrl(gameplayBackground);
        sceneBackground.appendChild(sceneImage);
        gw.appendChild(sceneBackground);

        // Title and mechanic HUD
        const titleArea = el('div', 'title-area');
        const environmentName =

        titleArea.innerHTML = `<h1>${esc(environmentName)}</h1>${playChallenge ? `<div class="gameplay-level-indicator">LEVEL ${selectedLevelIndex + 1}</div>` : ''}<p>${playChallenge ? `<strong>${esc(levelTitle)}</strong>` : ''}${esc(briefingText)}</p>`;
        if (playChallenge && worlds[selectedWorldIndex]) {
          gw.style.setProperty('--world-accent', worlds[selectedWorldIndex].accent || '#edaa38');
          gw.style.setProperty('--odd-color', cfg.oddColor || '#c34c31');

        }
        if (playChallenge) {
          gw.classList.add('world-game', 'mechanic-' + mechanic.replace(/[^a-z0-9-]/gi, '-'));
          if (mode === 'play') gw.classList.add('main-gameplay');
          titleArea.insertAdjacentHTML(
            'beforeend',
            '<div class="challenge-hud" aria-live="polite"></div>'
          );
          if (boxwiseSettings.calmPace)
            titleArea.querySelector('.challenge-hud').textContent = '🍃 Calm Pace';
        }
        const challengeHud = titleArea.querySelector('.challenge-hud');
        gw.appendChild(titleArea);
        if (mode === 'play' && playChallenge) createPlayerHud(gw, { activeGame: true });
        if (mode === 'preview') {

        }

          const previewButton = el('button', 'creator-mode-button');

          previewButton.textContent = 'PREVIEW LEVEL →';
          editorControls.append(editButton, previewButton);
          gw.appendChild(editorControls);
          gw.appendChild(buildCreatorWorkbench(selectedWorldIndex, selectedLevelIndex));
          previewButton.addEventListener('click', () => {
