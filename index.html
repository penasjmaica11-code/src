            else run('preview', selectedWorldIndex, selectedLevelIndex);
          });
        }

        // Progress bar
        const progWrap = el('div', 'progress-bar-wrap');
        const progFill = el('div', 'progress-bar-fill');
        progFill.style.width = '0%';
        progWrap.appendChild(progFill);
        titleArea.appendChild(progWrap);

        // Card zone
        const cardZone = el('div', 'card-zone');
        cardZone.style.zIndex = '2';
        gw.appendChild(cardZone);

        const card = el('div', 'number-card');
        card.id = 'active-card';
        card.style.backgroundColor = cfg.cardBg;
        card.style.backgroundImage = 'none';
        cardZone.appendChild(card);

        const sorterMascot = el('img', 'sorter-mascot');
        sorterMascot.alt = '';
        sorterMascot.draggable = false;
        const gameplayMascotId =
          mode === 'play' && playChallenge && artUrl('boxwise_gameplay_mascot')
            ? 'boxwise_gameplay_mascot'
            : 'boxwise_mascot';
        if (artUrl(gameplayMascotId)) sorterMascot.src = artUrl(gameplayMascotId);
        gw.appendChild(sorterMascot);

        // Feedback toast
        const toast = el('div', 'feedback-toast');
        gw.appendChild(toast);

        // Bins zone: responsive 2/3/4-column layouts for the selected challenge.
        const binsZone = el('div', 'bins-zone');
        binsZone.dataset.count = String(binLabels.length);
        let binElements = [];
        function renderBins() {
          binsZone.replaceChildren();
          binsZone.dataset.count = String(binLabels.length);
          binElements = binLabels.map((label, index) => {
            const binClass =
              'bin-world-' + index + (index === 0 ? ' bin-odd' : index === 1 ? ' bin-even' : '');
            const boxArtId = 'boxwise_sorting_box_' + (index % 2 === 0 ? 'left' : 'right');
            const bin = makeBin(
              binClass,
              ['🔷', '🟢', '⭐', '🌟'][index % 4],
              label,
              '',
              boxArtId
            );
            bin.dataset.binIndex = String(index);
            bin.addEventListener('click', () => {
              if (suppressBinClick) return;
              if (!dragState && isLiveMode) tryDrop(index, selectedPairIndex);
            });
            binsZone.appendChild(bin);
            return bin;
          });
        }
        renderBins();
        gw.appendChild(binsZone);

        // Counter
        const counter = el('div', 'counter');
        gw.appendChild(counter);
        let remainingTime = levelTimer;
        let timerInterval = null;
        let strikes = 0;
        let movingDirection = 1;
        let movingPhase = 0;
        let movingInterval = null;
        let pairedNext = false;
        let selectedPairIndex = -1;
        let suppressBinClick = false;
        let camoFound = false;
        let binSwitchInterval = null;
        const chaosArt = lib.getAsset('chaos_sprite');
        if (
          playChallenge &&
          (mechanic === 'distractor' || mechanic === 'changing-bin') &&
          chaosArt &&
          chaosArt.url
        ) {
          const sprite = el('img', 'chaos-sprite');
          sprite.src = chaosArt.url;
          sprite.alt = '';
          sprite.draggable = false;
          gw.appendChild(sprite);
        }

        // Keyboard hint
        const kbHint = el('div', 'kb-hint');
        kbHint.textContent = 'Keyboard: Choose a box with its number key, then press Enter';
        gw.appendChild(kbHint);

        // --- Functions ---
        function shuffle(arr) {
          for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
          }
          return arr;
        }

        function el(tag, cls) {
          const e = document.createElement(tag);
          if (cls) e.className = cls;
          return e;
        }

        function esc(s) {
          const d = document.createElement('div');
          d.textContent = s;
          return d.innerHTML;
        }

        function makeBin(
          cls,
          icon,
          label,
          hint,
          artId = 'boxwise_sorting_box_left',
        ) {
          const b = el('div', 'bin ' + cls);
          const art = el('img', 'bin-art');
          art.alt = '';
          art.draggable = false;
          if (artUrl(artId)) art.src = artUrl(artId);
          b.appendChild(art);
          const iconEl = el('div', 'bin-icon');
          iconEl.textContent = icon;
          const labelEl = el('div', 'bin-label');
          labelEl.textContent = label;
          const hintEl = el('div', 'bin-hint');
          hintEl.textContent = hint;
          b.appendChild(iconEl);
          b.appendChild(labelEl);
          b.appendChild(hintEl);
          return b;
        }

        async function usePowerUp(key) {
          if (mode !== 'play' || !playChallenge || isDone || currentIndex >= cards.length) return;
          const state = getBoxwiseState();
          if (!(state.inventory[key] > 0)) return;
          if (key === 'timeBubble' && levelTimer <= 0) return;
          if (key === 'hintLens' && mechanic === 'paired-item' && selectedPairIndex < 0) {
            showCharacterMessage('boxwise_sparky_character', 'Sparky says: Tap one card in the pair first, then use your Hint Lens.', false);
            return;
          }
          const updatedInventory = { [key]: state.inventory[key] - 1 };
          await saveBoxwiseState({ inventory: updatedInventory });
          updatePlayerHuds();
          if (key === 'hintLens') {
            let answer = cards[currentIndex].answer;
            if (mechanic === 'paired-item') {
              if (selectedPairIndex < 0) {
                await saveBoxwiseState({ inventory: { hintLens: state.inventory.hintLens } });
                updatePlayerHuds();
                showCharacterMessage('boxwise_sparky_character', 'Sparky says: Tap one card in the pair first, then use your Hint Lens.', false);
                return;
              }
              const match = cards[currentIndex].prompt.match(/Pair\s+(\d+)/i);
              const pairId = match ? match[1] : '';
              const pairCards = cards
                .slice(currentIndex, currentIndex + 2)
                .filter(
                  (entry) =>
                    pairId && new RegExp('Pair\\s+' + pairId + '\\b', 'i').test(entry.prompt)
                );
              const pairEntries = pairCards.length === 2 ? pairCards : [cards[currentIndex]];
              answer = pairEntries[selectedPairIndex] && pairEntries[selectedPairIndex].answer;
            }
            const target = binLabels.indexOf(answer);
            if (target >= 0 && binElements[target]) {
              binElements.forEach((bin) => bin.classList.remove('hint-pulse'));
              void binElements[target].offsetWidth;
              binElements[target].classList.add('hint-pulse');
              setTimeout(
                () => binElements[target] && binElements[target].classList.remove('hint-pulse'),
                2300
              );
              showCharacterMessage('boxwise_sparky_character', 'Sparky says: Your Hint Lens is glowing. Follow its sparkle!', true);
            }
            return;
          }
          if (key === 'timeBubble') {
            remainingTime += 15;
            updateMechanicHud();
            showFeedback(true);
            toast.textContent = 'Time Bubble! You have 15 extra seconds!';
            return;
          }
          if (key === 'shuffleBell') {
            if (mechanic === 'paired-item') {
              const remaining = cards.slice(currentIndex);
              const groups = [];
              while (remaining.length) {
                const first = remaining.shift();
                const match = first.prompt.match(/Pair\s+(\d+)/i);
                const pairId = match ? match[1] : '';
                const partnerIndex = pairId
                  ? remaining.findIndex((entry) =>
                      new RegExp('Pair\\s+' + pairId + '\\b', 'i').test(entry.prompt)
                    )
                  : -1;
                groups.push(
                  partnerIndex >= 0 ? [first, ...remaining.splice(partnerIndex, 1)] : [first]
                );
              }
              shuffle(groups);
              cards.splice(currentIndex, cards.length - currentIndex, ...groups.flat());
            } else {
              const waiting = shuffle(cards.slice(currentIndex));
              cards.splice(currentIndex, cards.length - currentIndex, ...waiting);
            }
            movingPhase = 0;
            showCard();
            showFeedback(true);
            toast.textContent = 'Ding! The waiting cards have been mixed!';
          }
        }

        async function completeSelectedLevel() {
          if (
            mode !== 'play' ||
            !playChallenge ||
            selectedWorldIndex === null ||
            selectedLevelIndex === null ||
            levelRewardRecorded
          )
            return;
          const world = worlds[selectedWorldIndex];
          if (!world || !world.id) return;
          levelRewardRecorded = true;
          const levelNumber = selectedLevelIndex + 1;
          const firstClear = recordLevelCompletion(world.id, levelNumber);
          const completedCount = Object.values(boxwiseState.completedLevels).reduce(
            (total, completed) => total + completed.length,
            0
          );
          const earnsHintKey = firstClear && completedCount % 5 === 0;
          lastClearReward = {
            coins: firstClear ? 25 : 0,
            stars: 0,
            hintKeys: earnsHintKey ? 1 : 0,
          };
          await saveBoxwiseState({
            coins: boxwiseState.coins + lastClearReward.coins,
            ...(earnsHintKey
              ? { inventory: { hintLens: boxwiseState.inventory.hintLens + 1 } }
              : {}),
          });
          const currentUnlocked = unlockedLevels[world.id] || 1;
          const nextUnlocked = Math.min(world.levels.length, selectedLevelIndex + 2);
          if (nextUnlocked > currentUnlocked) {
            unlockedLevels[world.id] = nextUnlocked;
            sessionProgress[world.id] = nextUnlocked;
          }
          await saveProgress();
          updatePlayerHuds();
        }

        function showCard() {
          if (currentIndex >= cards.length) {
            showDone();
            return;
          }
          const item = cards[currentIndex];
          if (mechanic === 'paired-item') {
            const pairMatch = item.prompt.match(/Pair\s+(\d+)/i);
            const pairId = pairMatch ? pairMatch[1] : '';
            const paired = cards
              .slice(currentIndex, currentIndex + 2)
              .filter(
                (entry) => pairId && new RegExp('Pair\\s+' + pairId + '\\b', 'i').test(entry.prompt)
              );
            const pairItems = paired.length === 2 ? paired : [item];
            card.dataset.pairCount = String(pairItems.length);
            card.dataset.pairDone = '0';
            card.innerHTML = `<div class="pair-items">${pairItems.map((entry, idx) => `<div class="pair-item" data-pair-index="${idx}"><span>${esc(entry.emoji)}</span><strong>${esc(entry.prompt.replace(/\s*·\s*Pair\s+\d+/i, ''))}</strong></div>`).join('')}</div>`;
            card.querySelectorAll('.pair-item').forEach((part) =>
              part.addEventListener('click', () => {
                selectedPairIndex = Number(part.dataset.pairIndex);
                card
                  .querySelectorAll('.pair-item')
                  .forEach((candidate) =>
                    candidate.classList.toggle('selected', candidate === part)
                  );
              })
            );
          } else {
            // Numeric cards already show the number as their prompt; omit number icons to avoid duplicates.
            const numericOnlyPrompt = /^\d+$/.test(item.prompt.trim());
            card.innerHTML = `${numericOnlyPrompt ? '' : `<span class="challenge-emoji">${esc(item.emoji)}</span>`}<span class="challenge-prompt">${esc(item.prompt)}</span>`;
          }
          card.classList.toggle('is-long', item.prompt.length > 11);
          card.classList.toggle('is-dots', /●|○/.test(item.prompt));
          card.classList.toggle('numeric-only', /^\d+$/.test(item.prompt.trim()));
          card.classList.toggle('pair-card', mechanic === 'paired-item');
          card.classList.toggle('camouflaged', mechanic === 'camouflage' && !camoFound);
          card.style.display = 'flex';
          card.classList.remove('correct-anim', 'wrong-anim');
          resetCardPosition();
          updateProgress();
          updateMechanicHud();
        }

        function updateMechanicHud() {
          if (!challengeHud) return;
          const timeText = levelTimer > 0 ? ` · ${Math.ceil(remainingTime)}s` : '';
          const strikeText =
            playChallenge && playChallenge.strikes
              ? ` · Tries ${Math.max(0, playChallenge.strikes - strikes)}`
              : '';
          let cue = '';
          if (mechanic === 'paired-item') cue = pairedNext ? ' · Pair partner!' : ' · Paired cards';
          if (mechanic === 'camouflage')
            cue = camoFound ? ' · Spotted! Now sort it' : ' · Tap the hidden creature';
          if (mechanic === 'moving-item') cue = ' · Catch it before it drifts away';
          if (mechanic === 'conveyor') cue = ' · Rolling along the market belt';
          if (mechanic === 'changing-bin') cue = ' · Watch the changing labels';
          const movesRemaining = Math.max(0, MAX_LEVEL_MOVES - movesUsed);
          const movesHud = gw.querySelector('.player-moves-under-hearts .moves-count');
          if (movesHud) movesHud.textContent = String(movesRemaining);
          const movesBox = gw.querySelector('.player-moves-under-hearts');
          if (movesBox) movesBox.setAttribute('aria-label', `${movesRemaining} sorting moves remaining`);
          challengeHud.textContent = `${boxwiseSettings.calmPace ? '🍃 Calm Pace' : ''}${timeText}${strikeText}${cue}`;
        }

        function resetCardPosition() {
          card.style.left = '';
          card.style.top = '';
          card.style.position = 'absolute';
          card.style.transform = 'translate(-50%, -50%)';
          // Center the sorting card in the visible play area.
          card.style.left = cardZone.clientWidth / 2 + 'px';
          card.style.top = cardZone.clientHeight / 2 + 'px';
        }

        function updateProgress() {
          const pct = (currentIndex / cards.length) * 100;
          progFill.style.width = pct + '%';
          counter.textContent = `Card ${Math.min(currentIndex + 1, cards.length)} of ${cards.length}`;
        }

        function endAsRetry(reason) {
          if (isDone) return;
          if (mode === 'play' && playChallenge) void losePlayerHeart().then(updatePlayerHuds);
          isDone = true;
          if (timerInterval) clearInterval(timerInterval);
          if (binSwitchInterval) clearInterval(binSwitchInterval);
          if (movingInterval && window.cancelAnimationFrame)
            window.cancelAnimationFrame(movingInterval);
          card.style.display = 'none';
          const ov = el('div', 'done-overlay');
          const panel = el('div', 'done-panel');
          panel.innerHTML = `<h2>🌱 Let's try again!</h2><p>${esc(reason)}</p><button type="button" class="retry-challenge">RETRY LEVEL</button>${isPreviewMode ? '<button type="button" class="preview-return-action">RETURN TO EDIT</button>' : '<button type="button" class="retry-map">BACK TO WORLDS</button>'}`;
          ov.appendChild(panel);
          gw.appendChild(ov);
          const retryButton = panel.querySelector('.retry-challenge');
          retryButton.disabled = !isPreviewMode && getBoxwiseState().hearts <= 0;
          if (!isPreviewMode && retryButton.disabled) {
            retryButton.textContent = 'WAIT FOR HEARTS';
            retryButton.title = lockoutText(getBoxwiseState());
          }
          retryButton.addEventListener('click', () => {
            if (!isPreviewMode && getBoxwiseState().hearts <= 0) return;
            ov.remove();
            isDone = false;
            cards = mechanic === 'paired-item' ? [...levelCards] : shuffle([...levelCards]);
            currentIndex = 0;
            movesUsed = 0;
            levelRewardRecorded = false;
            remainingTime = levelTimer;
            strikes = 0;
            camoFound = false;
            pairedNext = false;
            if (mechanic === 'changing-bin') binLabels = playChallenge.bins.map(String);
            renderBins();
            movingPhase = 0;
            startChallengeMechanics();
            showCard();
          });
          const previewReturn = panel.querySelector('.preview-return-action');
          if (previewReturn)
            previewReturn.addEventListener('click', () =>
              run('edit', selectedWorldIndex, selectedLevelIndex)
            );
          const retryMap = panel.querySelector('.retry-map');
          if (retryMap)
            retryMap.addEventListener('click', () => {
              window.__boxwiseMenuOpened = false;
              window.__boxwiseReturnToMap = true;
              run('play');
            });
        }

        function startChallengeMechanics() {
          if (timerInterval) clearInterval(timerInterval);
          if (window.__boxwiseTimerIntervals)
            window.__boxwiseTimerIntervals.forEach((timerId) => clearInterval(timerId));
          window.__boxwiseTimerIntervals = [];
          if (binSwitchInterval) clearInterval(binSwitchInterval);
          if (levelTimer > 0) {
            timerInterval = setInterval(() => {
              if (isDone || isPaused) return;
              remainingTime = Math.max(0, remainingTime - 1);
              updateMechanicHud();
              if (remainingTime <= 0)
                endAsRetry('Time is up. Take a breath and give this challenge another go!');
            }, 1000);
            window.__boxwiseTimerIntervals.push(timerInterval);
            window.__boxwiseRuntimeIntervals.push(timerInterval);
          }
          if (mechanic === 'changing-bin') {
            binSwitchInterval = setInterval(() => {
              if (isDone || binLabels.length !== 2) return;
              binLabels.reverse();
              binElements.forEach((bin, index) => {
                const label = bin.querySelector('.bin-label');
                if (label) label.textContent = binLabels[index];
                bin.classList.toggle('bin-odd', index === 0);
                bin.classList.toggle('bin-even', index === 1);
              });
              updateMechanicHud();
            }, 8500);
            window.__boxwiseTimerIntervals.push(binSwitchInterval);
            window.__boxwiseRuntimeIntervals.push(binSwitchInterval);
          }
          if (movingInterval && window.cancelAnimationFrame)
            window.cancelAnimationFrame(movingInterval);
          if (mechanic === 'moving-item' || mechanic === 'conveyor') {
            let lastMoveAt = 0;
            const moveFrame = (timestamp) => {
              if (isDone || !card.isConnected || card.style.display === 'none') return;
              if (lastMoveAt && !dragState && !isPaused) {
                const dt = Math.min(0.11, Math.max(0, (timestamp - lastMoveAt) / 1000));
                movingPhase += dt * movementSpeed * 0.85;
                const x =
                  mechanic === 'conveyor'
                    ? ((movingPhase * 42) % 220) - 110
                    : Math.sin(movingPhase) * 135;
                const y = mechanic === 'moving-item' ? Math.cos(movingPhase * 0.73) * 25 : 0;
                card.style.transform = 'translate(-50%, -50%)';
                card.style.left = cardZone.clientWidth / 2 + x + 'px';
                card.style.top = cardZone.clientHeight / 2 + y + 'px';
              }
              lastMoveAt = timestamp;
              movingInterval = requestAnimationFrame(moveFrame);
            };
            movingInterval = requestAnimationFrame(moveFrame);
            window.__boxwiseTimerIntervals.push(movingInterval);
            window.__boxwiseRuntimeIntervals.push(movingInterval);
          }
        }

        function showCharacterMessage(assetId, message, correct = true) {
          clearTimeout(feedbackTimer);
          toast.className = 'feedback-toast ' + (correct ? 'correct' : 'wrong') + ' show character-toast';
          toast.replaceChildren();
          const imageUrl = artUrl(assetId);
          if (imageUrl) {
            const image = el('img', 'feedback-character-image');
            image.src = imageUrl;
            image.alt = '';
            image.draggable = false;
            toast.appendChild(image);
          }
          const copy = el('span', 'feedback-character-copy');
          copy.textContent = message;
          toast.appendChild(copy);
          feedbackTimer = setTimeout(() => toast.classList.remove('show'), 2400);
        }

        function showFeedback(correct) {
          clearTimeout(feedbackTimer);
          toast.className = 'feedback-toast ' + (correct ? 'correct' : 'wrong') + ' show';
          if (correct) {
            toast.textContent = cfg.correctMsg;
          } else {
            // Keep the answer hidden; invite the player to think and try again.
            toast.textContent = `${cfg.wrongMsg} Try another box!`;
          }
          feedbackTimer = setTimeout(
            () => {
              toast.classList.remove('show');
            },
            correct ? 1400 : 2200
          );
        }

        async function validateSortWithApi(expectedLabel, selectedLabel) {
          if (standaloneMode) return expectedLabel === selectedLabel;
          const response = await fetch('/api/sort/validate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ expectedLabel, selectedLabel }),
          });
          if (!response.ok) throw new Error('Answer check request failed (' + response.status + ')');
          const result = await response.json();
          if (!result || typeof result.isCorrect !== 'boolean')
            throw new Error('Answer check returned an invalid response');
          return result.isCorrect;
        }

        async function tryDrop(binIndex, pairIndex = -1) {
          if (isDone || isPaused || answerCheckPending || currentIndex >= cards.length) return;
          if (mechanic === 'paired-item' && pairIndex < 0) return;
          let activePair;
          let targetPart;
          let pairEntries;
          let expectedAnswer;
          if (mechanic === 'paired-item') {
            activePair = card.querySelectorAll('.pair-item');
            targetPart = card.querySelector(`.pair-item[data-pair-index="${pairIndex}"]`);
            const pairMatch = cards[currentIndex].prompt.match(/Pair\s+(\d+)/i);
            const pairId = pairMatch ? pairMatch[1] : '';
            const pairCards = cards
              .slice(currentIndex, currentIndex + 2)
              .filter(
                (entry) => pairId && new RegExp('Pair\\s+' + pairId + '\\b', 'i').test(entry.prompt)
              );
            pairEntries = pairCards.length === 2 ? pairCards : [cards[currentIndex]];
            expectedAnswer = pairEntries[pairIndex] && pairEntries[pairIndex].answer;
            if (!targetPart || targetPart.classList.contains('sorted')) return;
          } else {
            expectedAnswer = cards[currentIndex].answer;
          }
          answerCheckPending = true;
          let correct;
          try {
            correct = await validateSortWithApi(expectedAnswer, binLabels[binIndex]);
          } catch (error) {
            if (lib.log) lib.log('Boxwise answer could not be checked: ' + error.message);
            showFeedback(false);
            if (toast) toast.textContent = 'Could not check your answer. Check the connection and try again.';
            return;
          } finally {
            answerCheckPending = false;
          }
          if (isDone || isPaused) return;
          movesUsed = Math.min(MAX_LEVEL_MOVES, movesUsed + 1);
          updateMechanicHud();
          if (mechanic === 'paired-item') {
            if (correct) {
              playCue('correct_sort_chime');
              targetPart.classList.add('sorted');
              targetPart.classList.remove('selected');
              showFeedback(true);
              const allSorted = Array.from(activePair).every((part) =>
                part.classList.contains('sorted')
              );
              selectedPairIndex = -1;
              if (allSorted) {
                card.classList.add('correct-anim');
                setTimeout(async () => {
                  currentIndex += pairEntries.length;
                  if (currentIndex >= cards.length) {
                    await completeSelectedLevel();
                    showDone();
                  } else if (movesUsed >= MAX_LEVEL_MOVES) {
                    endAsRetry('You used all 15 moves before every card was sorted. Try the level again!');
                  } else showCard();
                }, 450);
              } else if (movesUsed >= MAX_LEVEL_MOVES) {
                endAsRetry('You used all 15 moves before every card was sorted. Try the level again!');
              }
            } else {
              playCue('gentle_miss_cue');
              showFeedback(false);
              targetPart.classList.remove('selected');
              selectedPairIndex = -1;
              if (movesUsed >= MAX_LEVEL_MOVES)
                endAsRetry('You used all 15 moves before every card was sorted. Try the level again!');
            }
            return;
          }

          if (correct) {
            playCue('correct_sort_chime');
            card.classList.add('correct-anim');
            showFeedback(true);
            setTimeout(async () => {
              currentIndex++;
              pairedNext = false;
              camoFound = false;
              if (currentIndex >= cards.length) {
                await completeSelectedLevel();
                showDone();
              } else if (movesUsed >= MAX_LEVEL_MOVES) {
                endAsRetry('You used all 15 moves before every card was sorted. Try the level again!');
              } else showCard();
            }, 450);
          } else {
            playCue('gentle_miss_cue');
            card.classList.add('wrong-anim');
            showFeedback(false);
            if (movesUsed >= MAX_LEVEL_MOVES) {
              endAsRetry('You used all 15 moves before every card was sorted. Try the level again!');
              return;
            }
            if (playChallenge && playChallenge.strikes) {
              strikes++;
              if (strikes >= Number(playChallenge.strikes)) {
                card.classList.remove('wrong-anim');
                cards = shuffle([...levelCards]);
                currentIndex = 0;
                strikes = 0;
                showFeedback(false);
                if (toast) toast.textContent = 'Let’s mix the cards and try again!';
                setTimeout(() => showCard(), 650);
                updateMechanicHud();
                return;
              }
            }
            setTimeout(() => {
              card.classList.remove('wrong-anim');
              resetCardPosition();
              updateMechanicHud();
            }, 420);
          }
        }

        function proceedAfterSuccessfulLevel() {
          if (
            mode !== 'play' ||
            !playChallenge ||
            selectedWorldIndex === null ||
            selectedLevelIndex === null
          )
            return;
          const world = worlds[selectedWorldIndex];
          if (!world) return;
          const nextLevelIndex = selectedLevelIndex + 1;
          if (nextLevelIndex < world.levels.length) {
            window.__boxwiseMenuOpened = true;
            window.__boxwiseReturnToMap = false;
            window.__boxwiseReturnToLevelMap = null;
            window.__boxwisePendingBriefing = {
              worldIndex: selectedWorldIndex,
              levelIndex: nextLevelIndex,
            };
            window.__boxwiseAutoStartBriefing = true;
            run('play', selectedWorldIndex, nextLevelIndex);
          } else {
            // There is no further level in this world; return to its trail map automatically.
            window.__boxwiseMenuOpened = false;
            window.__boxwiseReturnToMap = false;
            window.__boxwiseReturnToLevelMap = selectedWorldIndex;
            window.__boxwiseAutoStartBriefing = false;
            run('play');
          }
        }

        function showDone() {
          isDone = true;
          if (timerInterval) clearInterval(timerInterval);
          if (binSwitchInterval) clearInterval(binSwitchInterval);
          if (movingInterval && window.cancelAnimationFrame)
            window.cancelAnimationFrame(movingInterval);
          card.style.display = 'none';
          progFill.style.width = '100%';
          counter.textContent = 'All done!';
          const ov = el('div', 'done-overlay');
          const panel = el('div', 'done-panel');
          if (playChallenge) {
            playCue('level_complete_sting');
            sprinkleCelebration();
          } else if (!isPreviewMode) playCue('level_complete_sting');
          const unlockedNow =
            selectedWorldIndex !== null && selectedLevelIndex !== null
              ? (unlockedLevels[worlds[selectedWorldIndex].id] || 1) > selectedLevelIndex + 1
              : false;
          const hasNextLevel =
            !!playChallenge &&
            mode === 'play' &&
            selectedWorldIndex !== null &&
            selectedLevelIndex + 1 < worlds[selectedWorldIndex].levels.length;
          panel.innerHTML = `<h2>🎉 Great Job!</h2><p>${playChallenge ? 'You completed ' + esc(playChallenge.title) + '!' : 'You sorted all the numbers!'}</p>
      ${playChallenge && mode === 'play' ? `<p>${lastClearReward.coins ? `🪙 +${lastClearReward.coins} coins` : 'This level was already completed; no repeat reward.'}${lastClearReward.hintKeys ? ' · 🗝️ +1 Hint Key' : ''}</p>` : ''}
      ${unlockedNow ? '<p>✨ The next level is now unlocked in this world!</p>' : ''}
      ${playChallenge && mode === 'play' && !hasNextLevel ? '<p>🌟 You finished this world! Returning to its level map…</p>' : ''}
      ${isPreviewMode ? '<button id="preview-edit-btn">RETURN TO EDIT</button>' : playChallenge && mode === 'play' ? `<button id="next-level-btn">${hasNextLevel ? 'NEXT LEVEL' : 'BACK TO LEVELS'}</button>` : '<button id="replay-btn">Play Again</button>'}${playChallenge && !isPreviewMode ? '<button id="world-map-btn">WORLD MAP</button>' : ''}`;
          if (playChallenge && artUrl('boxwise_gifty_character')) {
            const giftCharacter = el('img', 'done-character-gifty');
            giftCharacter.src = artUrl('boxwise_gifty_character');
            giftCharacter.alt = 'Gifty celebrating your reward';
            giftCharacter.draggable = false;
            panel.insertBefore(giftCharacter, panel.firstChild);
          }
          ov.appendChild(panel);
          gw.appendChild(ov);
          const previewEditButton = panel.querySelector('#preview-edit-btn');
          if (previewEditButton)
            previewEditButton.addEventListener('click', () =>
              run('edit', selectedWorldIndex, selectedLevelIndex)
            );
          const nextLevelButton = panel.querySelector('#next-level-btn');
          if (nextLevelButton)
            nextLevelButton.addEventListener('click', () => {
              if (window.__boxwiseAutoAdvanceTimeout) {
                clearTimeout(window.__boxwiseAutoAdvanceTimeout);
                window.__boxwiseAutoAdvanceTimeout = null;
              }
              proceedAfterSuccessfulLevel();
            });
          const replayButton = panel.querySelector('#replay-btn');
          if (replayButton) replayButton.disabled = getBoxwiseState().hearts <= 0;
          if (replayButton && replayButton.disabled) {
            replayButton.textContent = 'WAIT FOR HEARTS';
            replayButton.title = lockoutText(getBoxwiseState());
          }
          if (replayButton)
            replayButton.addEventListener('click', () => {
              if (getBoxwiseState().hearts <= 0) return;
              ov.remove();
              isDone = false;
              cards = mechanic === 'paired-item' ? [...levelCards] : shuffle([...levelCards]);
              currentIndex = 0;
              movesUsed = 0;
              levelRewardRecorded = false;
              if (timerInterval) clearInterval(timerInterval);
              if (binSwitchInterval) clearInterval(binSwitchInterval);
              if (movingInterval && window.cancelAnimationFrame)
                window.cancelAnimationFrame(movingInterval);
              remainingTime = levelTimer;
              strikes = 0;
              camoFound = false;
              pairedNext = false;
              selectedPairIndex = -1;
              if (mechanic === 'changing-bin') binLabels = playChallenge.bins.map(String);
              renderBins();
              movingPhase = 0;
              startChallengeMechanics();
              kbSelected = -1;
              clearKbHighlight();
              showCard();
            });
          const mapButton = panel.querySelector('#world-map-btn');
          if (mapButton) {
            mapButton.textContent = 'WORLD MAP';
            mapButton.addEventListener('click', () => {
              if (window.__boxwiseAutoAdvanceTimeout) {
                clearTimeout(window.__boxwiseAutoAdvanceTimeout);
                window.__boxwiseAutoAdvanceTimeout = null;
              }
              window.__boxwiseAutoStartBriefing = false;
              window.__boxwiseMenuOpened = false;
              window.__boxwiseReturnToMap = true;
              run('play');
            });
          }
          if (playChallenge && mode === 'play') {
            window.__boxwiseAutoAdvanceTimeout = setTimeout(() => {
              window.__boxwiseAutoAdvanceTimeout = null;
              if (isDone && ov.isConnected) proceedAfterSuccessfulLevel();
            }, 2200);
          }
        }

        function hitTest(x, y, binEl) {
          const r = binEl.getBoundingClientRect();
          return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
        }

        // --- Drag and Drop ---
        function pointerDown(e) {
          if (
            isDone ||
            isPaused ||
            !isLiveMode ||
            !e.isPrimary ||
            e.button !== 0 ||
            dragState
          )
            return;
          if (!(e.target instanceof Element) || !card.contains(e.target)) return;
          const cr = card.getBoundingClientRect();
          const px = e.clientX;
          const py = e.clientY;
          if (px < cr.left || px > cr.right || py < cr.top || py > cr.bottom) return;
          if (mechanic === 'camouflage' && !camoFound) return;
          const pairPart =
            mechanic === 'paired-item' && e.target && e.target.closest
              ? e.target.closest('.pair-item')
              : null;
          if (mechanic === 'paired-item' && !pairPart) return;
          e.preventDefault();
          const zoneRect = cardZone.getBoundingClientRect();
          const cardScaleX = cr.width / card.offsetWidth;
          const cardScaleY = cr.height / card.offsetHeight;
          dragState = {
            pointerId: e.pointerId,
            startX: px,
            startY: py,
            offsetX: pairPart
              ? px - pairPart.getBoundingClientRect().left
              : (px - cr.left) / cardScaleX,
            offsetY: pairPart
              ? py - pairPart.getBoundingClientRect().top
              : (py - cr.top) / cardScaleY,
            zoneScaleX: zoneRect.width / cardZone.offsetWidth,
            zoneScaleY: zoneRect.height / cardZone.offsetHeight,
            pairIndex: pairPart ? Number(pairPart.dataset.pairIndex) : -1,
            part: pairPart,
          };
          card.classList.add('dragging');
          cardZone.style.zIndex = '9';
          card.setPointerCapture(e.pointerId);
        }

        function pointerMove(e) {
          if (!dragState || dragState.pointerId !== e.pointerId) return;
          e.preventDefault();
          const px = e.clientX;
          const py = e.clientY;
          if (dragState.part) {
            const deltaX = (px - dragState.startX) / dragState.zoneScaleX;
            const deltaY = (py - dragState.startY) / dragState.zoneScaleY;
            dragState.part.style.position = 'relative';
            dragState.part.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
            dragState.part.style.zIndex = '120';
          } else {
            const zoneRect = cardZone.getBoundingClientRect();
            card.style.transform = 'none';
            card.style.left =
              (px - zoneRect.left) / dragState.zoneScaleX - dragState.offsetX + 'px';
            card.style.top =
              (py - zoneRect.top) / dragState.zoneScaleY - dragState.offsetY + 'px';
          }

          // Hover feedback on bins
          binElements.forEach((bin) => bin.classList.toggle('hover', hitTest(px, py, bin)));
        }

        function pointerUp(e, cancelled = false) {
          if (!dragState || dragState.pointerId !== e.pointerId) return;
          card.classList.remove('dragging');
          cardZone.style.zIndex = '2';
          binElements.forEach((bin) => bin.classList.remove('hover'));

          const px = e.clientX;
          const py = e.clientY;
          const targetIndex = cancelled
            ? -1
            : binElements.findIndex((bin) => hitTest(px, py, bin));
          const pairIndex = dragState.pairIndex;
          const pairPart = dragState.part;
          if (pairPart) {
            pairPart.style.position = '';
            pairPart.style.transform = '';
            pairPart.style.zIndex = '';
          }
          dragState = null;
          if (targetIndex >= 0) {
            suppressBinClick = true;
            setTimeout(() => {
              suppressBinClick = false;
            }, 280);
            if (mechanic === 'paired-item' && pairIndex >= 0) tryDrop(targetIndex, pairIndex);
            else tryDrop(targetIndex);
          } else {
            resetCardPosition();
            if (!cancelled && mode === 'play' && playChallenge) {
              playCue('gentle_miss_cue');
              showFeedback(false);
              toast.textContent = 'That card slipped away. Try another one!';
            }
          }
        }

        gw.addEventListener('pointerdown', pointerDown);
        gw.addEventListener('pointermove', pointerMove);
        gw.addEventListener('pointerup', pointerUp);
        gw.addEventListener('pointercancel', (e) => pointerUp(e, true));
        gw.addEventListener('lostpointercapture', (e) => pointerUp(e, true));

        // Camouflage targets must be spotted before they can be dragged.
        card.addEventListener('click', () => {
          if (mechanic === 'camouflage' && !camoFound && isLiveMode) {
            camoFound = true;
            card.classList.remove('camouflaged');
            showFeedback(true);
            updateMechanicHud();
          }
        });

        // --- Keyboard ---
        function clearKbHighlight() {
          binElements.forEach((bin) => bin.classList.remove('kb-selected'));
        }

        window.addEventListener('keydown', (e) => {
          if (isDone || isPaused || !isLiveMode) return;
          const numberKey = Number(e.key) - 1;
          if (Number.isInteger(numberKey) && numberKey >= 0 && numberKey < binElements.length) {
            kbSelected = numberKey;
            clearKbHighlight();
            binElements[kbSelected].classList.add('kb-selected');
            e.preventDefault();
          }
          if ((e.key === 'Enter' || e.key === ' ') && kbSelected >= 0) {
            e.preventDefault();
            tryDrop(kbSelected);
            setTimeout(() => {
              clearKbHighlight();
              kbSelected = -1;
            }, 300);
          }
          if ((e.key === 'ArrowLeft' || e.key === 'ArrowUp') && binElements.length) {
            kbSelected = Math.max(0, kbSelected - 1);
            clearKbHighlight();
            binElements[kbSelected].classList.add('kb-selected');
            e.preventDefault();
          }
          if ((e.key === 'ArrowRight' || e.key === 'ArrowDown') && binElements.length) {
            kbSelected = Math.min(binElements.length - 1, kbSelected + 1);
            clearKbHighlight();
            binElements[kbSelected].classList.add('kb-selected');
            e.preventDefault();
          }
        });

        window.addEventListener('blur', () => {
          kbSelected = -1;
          clearKbHighlight();
        });

        // --- Edit mode: show cards as static, allow re-ordering via config ---
        if (mode === 'edit') {
          card.style.cursor = 'default';
          kbHint.textContent =
            'Edit Mode – use creator controls to update this level, then Preview';
        }

        function showGameplayBriefing() {
          if (!showIntroBriefing || !playChallenge || !worlds[selectedWorldIndex]) return;
          const world = worlds[selectedWorldIndex];
          const overlay = el('div', 'gameplay-briefing-overlay');
          const panel = el('section', 'gameplay-briefing-panel');
          const mechanicLabel = String(playChallenge.mechanic || 'sorting').replace(/[-_]/g, ' ');
          panel.innerHTML = `<p class="briefing-world">${esc(world.name)} · LEVEL ${selectedLevelIndex + 1} · ${esc(mechanicLabel)}</p><h2>${esc(playChallenge.title)}</h2><p>${esc(playChallenge.briefing)}</p><div class="gameplay-briefing-actions"><button type="button" class="explore-button briefing-start">START LEVEL</button><button type="button" class="explore-button briefing-back">BACK TO LEVELS</button></div>`;
          if (artUrl('boxwise_ms_wise_character')) {
            const guide = el('div', 'briefing-character-guide');
            const guideImage = el('img');
            guideImage.src = artUrl('boxwise_ms_wise_character');
            guideImage.alt = 'Ms. Wise, your learning guide';
            guideImage.draggable = false;
            const guideMessage = el('span');
            guideMessage.textContent = 'Ms. Wise says: Let’s learn together!';
            guide.append(guideImage, guideMessage);
            panel.insertBefore(guide, panel.firstChild);
          }
          overlay.appendChild(panel);
          gw.appendChild(overlay);
          panel.querySelector('.briefing-start').addEventListener('click', () => {
            if (window.__boxwiseAutoStartTimer) {
              clearTimeout(window.__boxwiseAutoStartTimer);
              window.__boxwiseAutoStartTimer = null;
            }
            window.__boxwiseAutoStartBriefing = false;
            overlay.remove();
            startChallengeMechanics();
          });
          if (window.__boxwiseAutoStartBriefing) {
            window.__boxwiseAutoStartBriefing = false;
            const startButton = panel.querySelector('.briefing-start');
            startButton.textContent = 'STARTING SOON · TAP TO START';
            window.__boxwiseAutoStartTimer = setTimeout(() => {
              window.__boxwiseAutoStartTimer = null;
              if (overlay.isConnected) startButton.click();
            }, 3500);
          }
          panel.querySelector('.briefing-back').addEventListener('click', () => {
            if (window.__boxwiseAutoStartTimer) {
              clearTimeout(window.__boxwiseAutoStartTimer);
              window.__boxwiseAutoStartTimer = null;
            }
            window.__boxwiseAutoStartBriefing = false;
            window.__boxwiseMenuOpened = false;
            window.__boxwiseReturnToMap = true;
            window.__boxwiseReturnToLevelMap = selectedWorldIndex;
            run('play');
          });
        }

        // --- Start ---
        if (mode !== 'edit') {
          showCard();
          if (mode === 'play') void startBackgroundMusic();
          if (showIntroBriefing) showGameplayBriefing();
          else startChallengeMechanics();
        } else if (playChallenge) showCard();
      }

      if (standaloneMode) {
        const gw = document.getElementById('game-world');
        gw.classList.add('standalone');
        const resizeStandaloneGame = () => {
          const scale = Math.min(window.innerWidth / 720, window.innerHeight / 1280);
          gw.style.transform = `translate(-50%, -50%) scale(${scale})`;
        };
        resizeStandaloneGame();
        window.addEventListener('resize', resizeStandaloneGame);
        void run('play');
      }
    </script>
  </body>
</html>
